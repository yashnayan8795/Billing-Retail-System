spring.application.name=Bilingsoftware

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/billing_software?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=your_password_here
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Configuration
server.port=8080

# JWT Configuration
jwt.secret=your_jwt_secret_key_here
jwt.expiration=86400000

# AWS S3 Configuration (if using)
aws.access.key.id=your_aws_access_key
aws.secret.access.key=your_aws_secret_key
aws.s3.region=your_aws_region
aws.s3.bucket.name=your_bucket_name

# Razorpay Configuration (if using)
razorpay.key.id=your_razorpay_key_id
razorpay.key.secret=your_razorpay_key_secret
